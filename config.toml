# Awesome AI Architect: configuration
#
# Everything the generator needs lives here. Edit this file, push, and the next
# run re-classifies every repository. No code change required.

[list]
user = "alebgl77"
title = "Awesome AI Architect"
tagline = "A self-updating map of the GenAI engineering stack: agents, RAG, MCP, evals, LLMOps and AI security. Classified automatically from the GitHub stars and open-source work of an AI architect."
author = "Alexandre Beguel"
author_url = "https://github.com/alebgl77"
site_url = "https://alebgl77.github.io/awesome-ai-architect/"
repo = "alebgl77/awesome-ai-architect"
# Hosted explorer reused by forks and template copies (?repo=owner/name), so they need no Pages.
explorer_url = "https://alebgl77.github.io/awesome-ai-architect/"
# Items shown per category in README before the rest folds into <details>.
readme_top = 20
# Recently starred / rising sections size.
highlight_size = 10
# Days of star-count history kept to compute momentum.
history_days = 35
# Public repositories of `user` that never appear (exact names).
exclude_own = ["alebgl77", "awesome-ai-architect"]
# Starred repositories that never appear (owner/name).
exclude_starred = []

# Force a category when the automatic classifier is wrong: "owner/name" = "category-id".
[overrides]
# "owner/name" = "category-id"
"thedotmack/claude-mem" = "memory"
"rohitg00/agentmemory" = "memory"
"zilliztech/memsearch" = "memory"

# ---------------------------------------------------------------------------
# Taxonomy
#
# Scoring per repository:
#   strong topic match   = 3 points   (GitHub topics are curated by the author)
#   weak topic match     = 1 point    (ecosystem names that appear everywhere)
#   keyword in name      = 2 points
#   keyword in description = 1 point
# Highest score wins; ties go to the category listed first (most specific first).
# Every other category scoring >= `secondary_min` becomes a secondary tag.
# A repository scoring 0 everywhere lands in "triage".
# ---------------------------------------------------------------------------

[scoring]
strong_topic = 3
weak_topic = 1
name = 2
description = 1
secondary_min = 3
max_secondary = 3

